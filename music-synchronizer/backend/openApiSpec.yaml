openapi: 3.0.3
info:
  title: Music Synchronizer API
  version: 1.0.0
  description: |
    API for synchronizing music playlists and discographies between services.

    ## Usage:
    1. The playlist you wish to synchronize must already exist in both services. It is okay if it is empty in one of the services.
    2. For YouTube updates, playlists must have the word 'music' in the description to be marked for potential synchronization.

    ### The `proposedChangesId` Value
    The proposedChangesId is the way that we can track what songs should be added from the sourcePlaylist to the targetPlaylist. It is generated using the route:

    `GET /updates/sourceUser/{sourceUser}/targetUser/{targetUser}/sourceService/{sourceService}/targetService/{targetService}/playlist/{playlist}`

    This value can be used with requests to limit the number of requests to the youtube or spotify api. For now, it MUST also be used in the body of the `POST /synchronize/sourceUser/{sourceUser}/targetUser/{targetUser}/sourceService/{sourceService}/targetService/{targetService}/playlist/{playlist}` request.
servers:
  - url: http://mainframe:{port}
    variables:
      port:
        default: '60000'
paths:
  /authorize/user/{user}/service/{service}:
    get:
      summary: Authorize a new user for a specific music service
      description: Initiates the authorization flow for a user to connect their account to either Spotify or YouTube Music service
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: string
          description: The username to associate with the authorization. This will be stored in HCPVault.
        - name: service
          in: path
          required: true
          schema:
            type: string
            enum: [spotify, youtube]
          description: The music service to authorize ('spotify' or 'youtube').
      responses:
        '200':
          description: Authorization URL for the specified service
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorizationUrl:
                    type: string
                    format: uri
                    description: The URL to redirect the user to for authorization
                  state:
                    type: string
                    description: State parameter for OAuth flow security
        '400':
          description: Invalid service specified
        '500':
          description: Internal server error

  /authorize/service/{service}/redirect:
    get:
      summary: Handle OAuth callback from music service. This might only work when hosted locally - as the redirect uri in spotify and google are currently setup to use local host and not the mainframe. In order to get this working I will need to setup https cert on the home server.
      description: Handles the callback from the music service after user authorization
      parameters:
        - name: service
          in: path
          required: true
          schema:
            type: string
            enum: [spotify, youtube]
          description: The music service handling the callback
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: Authorization code from the service
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: State parameter for security validation
      responses:
        '200':
          description: Authorization successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Success message
                  username:
                    type: string
                    description: The username that was authorized
        '400':
          description: Invalid callback parameters
        '500':
          description: Internal server error
  /synchronize/sourceUser/{sourceUser}/targetUser/{targetUser}/sourceService/{sourceService}/targetService/{targetService}/playlist/{playlist}:
    post:
      summary: Synchronize a specific playlist from source to target
      parameters:
        - $ref: '#/components/parameters/sourceUser'
        - $ref: '#/components/parameters/targetUser'
        - $ref: '#/components/parameters/sourceService'
        - $ref: '#/components/parameters/targetService'
        - $ref: '#/components/parameters/playlist'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                proposedChangesId:
                  type: string
      responses:
        '200':
          description: A list of songs that failed to be added to the target playlist
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Song'
        '404':
          description: Proposed changes not found
        '400':
          description: Invalid request
        '500':
          description: Internal server error
  /updates/sourceUser/{sourceUser}/targetUser/{targetUser}/sourceService/{sourceService}/targetService/{targetService}/playlist/{playlist}:
    get:
      summary: Get proposed updates for a specific playlist
      parameters:
        - $ref: '#/components/parameters/sourceUser'
        - $ref: '#/components/parameters/targetUser'
        - $ref: '#/components/parameters/sourceService'
        - $ref: '#/components/parameters/targetService'
        - $ref: '#/components/parameters/playlist'
        - $ref: '#/components/parameters/proposedChangesIdHeader'
      responses:
        '200':
          description: Proposed changes for playlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposedChanges'
        '400':
          description: Invalid request
        '500':
          description: Internal server error
    post:
      summary: Update or remove a proposed change in memory for a specific playlist
      parameters:
        - $ref: '#/components/parameters/sourceUser'
        - $ref: '#/components/parameters/targetUser'
        - $ref: '#/components/parameters/sourceService'
        - $ref: '#/components/parameters/targetService'
        - $ref: '#/components/parameters/playlist'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - proposedChangesId
                - sourceSongId
                - targetSongId
                - operation
              properties:
                proposedChangesId:
                  type: string
                  description: The ID of the proposed changes memory object to update.
                sourceSongId:
                  type: string
                  description: The ID of the source song.
                targetSongId:
                  type: string
                  description: The ID of the target song.
                operation:
                  type: string
                  enum: [update, remove]
                  description: The operation to perform ("update" or "remove").
      responses:
        '200':
          description: Updated ProposedChanges object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposedChanges'
        '400':
          description: Invalid request
        '500':
          description: Internal server error
components:
  parameters:
    sourceUser:
      name: sourceUser
      in: path
      required: true
      schema:
        type: string
      description: Username for the source user. This is generated by the API and stored in the HCPVault. It may not correlate to your service's username.
    targetUser:
      name: targetUser
      in: path
      required: true
      schema:
        type: string
      description: Username for the target user. This is generated by the API and stored in the HCPVault. It may not correlate to your service's username.
    sourceService:
      name: sourceService
      in: path
      required: true
      schema:
        type: string
      description: The source music service (e.g., 'spotify', 'youtube').
    targetService:
      name: targetService
      in: path
      required: true
      schema:
        type: string
      description: The target music service (e.g., 'spotify', 'youtube').
    playlist:
      name: playlist
      in: path
      required: true
      schema:
        type: string
      description: The name of the playlist to synchronize or update.
    proposedChangesIdHeader:
      name: proposed-changes-id
      in: header
      required: false
      schema:
        type: string
      description: Optional header for tracking the ID of proposed changes. Used for playlist synchronization and update endpoints.
  schemas:
    Song:
      type: object
      required:
        - title
        - artists
      properties:
        title:
          type: string
        artists:
          type: array
          items:
            type: string
        description:
          type: string
        videoId:
          type: string
    SongMapping:
      type: object
      required:
        - sourceSong
        - targetSong
      properties:
        sourceSong:
          $ref: '#/components/schemas/Song'
        targetSong:
          $ref: '#/components/schemas/Song'
    ProposedChanges:
      type: object
      required:
        - confidentProposedChanges
        - uncertainProposedChanges
      properties:
        confidentProposedChanges:
          type: array
          items:
            $ref: '#/components/schemas/SongMapping'
        uncertainProposedChanges:
          type: array
          items:
            $ref: '#/components/schemas/SongMapping'
