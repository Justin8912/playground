type Game {
  id: ID!
  ruleset: Ruleset!
  cards: [Card!]!
}

type Card {
  id: ID!
  word: String!
  owner: Team!
  lastSelectedBy: Team
  classification: Classification
  gameId: ID!
}

input CardInput {
  ids: [ID!]!
  lastSelectedBy: Team!
}

type Query {
  getGame(id: ID!): Game!
  getAllGames: [Game!]!
}

type CreateGameReturn {
  status: String!
  gameId: String
}

type DeleteGameReturn {
  status: String!
  message: String
}

type Mutation {
  createGame(ruleset: Ruleset!): CreateGameReturn!
  updateCard(cardInput: CardInput!): Game!
  deleteGame(gameId: ID!): DeleteGameReturn!
}

enum Team {
  Blue
  Red
  Green1
  Green2
  None
}

enum Ruleset {
  Duos
  Multiplayer
}

enum Classification {
 assassin,
 bystander,
 clue
}